# A site-specific bundle, of the kind a deployment would ship on its own classpath: everything that
# is the same for every connector talking to this realm. The deployment-specific values, the issuer
# URL and the client credentials, stay in the connector configuration.
grantType=password
clientAuthMethod=client_secret_basic
scope=openid email roles
tokenField=access_token
# This realm caps the client at a three second token, so any skew would report every token as
# already expired.
refreshSkewSeconds=0
maxRetries=2
