# Google: the signed JWT is the whole credential, and the JWT Neo4j can verify is the id_token.
# Everything else - the service account as assertion.claim.iss / assertion.claim.sub, and
# assertion.claim.target_audience - is specific to your service account, so it stays with you.
grantType=jwt_bearer
clientAuthMethod=none
tokenEndpoint=https://oauth2.googleapis.com/token
tokenField=id_token
